<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Machine learning projects." />
  <meta name="theme-color" content="#030406" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Slowly drifting background glows (colours set from projects.js) -->
  <div class="glows" aria-hidden="true">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <div class="glow g4"></div>
    <div class="focus-glow"></div>
  </div>

  <main id="stage" class="stage">
    <h1 class="visually-hidden" id="site-title">Portfolio</h1>

    <button id="orb" class="orb" type="button" aria-label="Contact me">
      <span class="orb-pulse" aria-hidden="true"></span>
      <span class="orb-ring" aria-hidden="true"></span>
      <span class="orb-core">
        <span class="orb-label">Contact me</span>
      </span>
    </button>

    <nav id="cards" class="cards" aria-label="Projects"></nav>
  </main>

  <section id="panel" class="panel" aria-live="polite" hidden>
    <div class="panel-inner" id="panel-inner"></div>
  </section>

  <footer class="footer" id="footer"></footer>

  <noscript>
    <p class="noscript">This portfolio needs JavaScript to show its projects.</p>
  </noscript>

  <script src="projects.js"></script>
  <script src="main.js"></script>
</body>
</html>
